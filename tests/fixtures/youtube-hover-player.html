<!doctype html>
<html><head><style>
  body { margin: 0; background: #111; color: white; font-family: Arial; }
  #movie_player { position: relative; margin: 40px; width: 960px; height: 540px; background: #303840; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; }
  #movie_player, #movie_player video { cursor: default; }
  #movie_player.ytp-autohide, #movie_player.ytp-autohide video { cursor: none; }
  .ytp-chrome-top { position: absolute; top: 0; width: 100%; opacity: 0; }
  .ytp-chrome-bottom { position: absolute; bottom: 0; width: 100%; height: 64px; opacity: 0; }
  .ytp-progress-bar-container { position: absolute; left: 12px; right: 12px; top: 0; height: 12px; }
  .ytp-progress-bar { position: absolute; inset: 0; background: #999; }
  .ytp-tooltip { display: none; position: absolute; left: 70px; bottom: 80px; width: 200px; height: 110px; background: #ddd; color: #111; }
  #movie_player[data-native-hover="true"] .ytp-tooltip { display: block; }
  .ytp-timely-actions-overlay { position: absolute; right: 30px; bottom: 110px; }
  /* Match the modern player's separate fullscreen title and overlay stack.
     A transparent quick-action row still raises the channel icon below it. */
  .ytp-overlays-container { position: absolute; top: 24px; left: 24px; right: 24px; bottom: 96px; transition: bottom .1s; pointer-events: none; }
  .ytp-autohide .ytp-overlays-container { bottom: 24px; }
  .ytp-overlay-bottom-right { position: absolute; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-end; }
  .ytp-overlay-bottom-right > * { pointer-events: auto; margin-top: 12px; }
  .iv-branding { width: 28px; height: 28px; background: #cb9d38; border-radius: 50%; }
  .ytp-fullscreen-metadata { position: absolute; top: 0; left: 0; height: 30px; opacity: 0; }
  .ytp-fullscreen-quick-actions { height: 28px; opacity: 0; }
  .ytp-autohide .ytp-fullscreen-metadata, .ytp-autohide .ytp-fullscreen-quick-actions { height: 0; margin: 0; }
  .ytp-fullscreen-grid { position: absolute; left: 48%; bottom: 6px; opacity: 0; }
  #ytp-caption-window-container { position: absolute; inset: 0; pointer-events: none; }
  .caption-window { position: absolute; width: 200px; height: 36px; background: #000a; color: white; }
  .caption-window.ytp-caption-window-bottom { margin-bottom: 64px; transition: margin-bottom .1s; }
  .caption-window.modern-caption { margin-bottom: 64px; transition: margin-bottom .1s; }
  .ytp-autohide .caption-window.ytp-caption-window-bottom { margin-bottom: 0; }
  .ytp-autohide .caption-window.modern-caption { margin-bottom: 0; }
</style></head><body>
<div id="movie_player" class="ytp-autohide" data-native-hover="false">
  <video muted playsinline></video>
  <div class="ytp-chrome-top">Video title</div>
  <div class="ytp-tooltip">Pull up for precise seeking</div>
  <div class="ytp-chrome-bottom"><div class="ytp-progress-bar-container"><div class="ytp-progress-bar"></div></div></div>
  <div class="ytp-overlays-container">
    <div class="ytp-fullscreen-metadata">Modern fullscreen video title</div>
    <div class="ytp-overlay-bottom-right">
      <div class="iv-branding" aria-label="Channel watermark"></div>
      <div class="ytp-fullscreen-quick-actions" data-overlay-order="13">
    <yt-player-quick-action-buttons class="ytPlayerQuickActionButtonsHost ytPlayerQuickActionButtonsHostCompactControls ytPlayerQuickActionButtonsHostDisableBackdropFilter">
      <button aria-label="like this video"><span class="ytSpecTouchFeedbackShapeFill"></span>Like</button>
      <button aria-label="Dislike this video"><span class="ytSpecTouchFeedbackShapeFill"></span>Dislike</button>
      <button aria-label="Comments"><span class="ytSpecTouchFeedbackShapeFill"></span>Comments</button>
      <button aria-label="Share"><span class="ytSpecTouchFeedbackShapeFill"></span>Share</button>
      <button aria-label="More actions"><span class="ytSpecTouchFeedbackShapeFill"></span>More</button>
    </yt-player-quick-action-buttons>
      </div>
    </div>
  </div>
  <div class="ytp-fullscreen-grid"><button aria-label="Show related videos">⌃</button></div>
  <div id="ytp-caption-window-container">
    <div id="bottom-caption" class="caption-window ytp-caption-window-bottom ytp-caption-window-rollup" style="left:30%;bottom:2%">Bottom roll-up caption</div>
    <div id="positioned-caption" class="caption-window modern-caption" style="left:5%;bottom:35%">Custom-position modern caption</div>
    <div id="top-caption" class="caption-window" style="left:60%;top:8%">Authored top caption</div>
  </div>
</div>
<script>
  const player = document.getElementById('movie_player');
  const video = player.querySelector('video');
  const timeline = player.querySelector('.ytp-progress-bar');
  const bar = player.querySelector('.ytp-chrome-bottom');
  const title = player.querySelector('.ytp-chrome-top');
  const metadata = player.querySelector('.ytp-fullscreen-metadata');
  const quickActions = player.querySelector('.ytp-fullscreen-quick-actions');
  const grid = player.querySelector('.ytp-fullscreen-grid');
  window.hoverFixture = { checks: 0, hovers: 0, leaves: 0, playerLeaves: 0, nativeHides: 0, nativeShows: 0, controlsDisabled: false, actions: 0, jumps: 0, offerJump: false, jumpDelay: 0, seeks: 0 };
  player.hideControls = () => {
    hoverFixture.nativeHides += 1;
    hoverFixture.controlsDisabled = true;
    bar.style.display = 'none'; title.style.display = 'none';
    bar.style.opacity = '0'; title.style.opacity = '0'; quickActions.style.opacity = '0'; grid.style.opacity = '0';
    player.dataset.nativeHover = 'false';
  };
  player.showControls = () => {
    hoverFixture.nativeShows += 1;
    hoverFixture.controlsDisabled = false;
    bar.style.display = ''; title.style.display = '';
  };
  let hideControls;
  function wakeControls(event) {
    if (event?.type === "mousemove" && !event.isTrusted) hoverFixture.checks += 1;
    if (hoverFixture.controlsDisabled) return;
    player.classList.remove('ytp-autohide');
    bar.style.opacity = '1';
    title.style.opacity = '1';
    metadata.style.opacity = '1';
    quickActions.style.opacity = '1';
    grid.style.opacity = '1';
    clearTimeout(hideControls);
    hideControls = setTimeout(() => {
      player.classList.add('ytp-autohide');
      bar.style.opacity = '0'; title.style.opacity = '0'; metadata.style.opacity = '0'; quickActions.style.opacity = '0'; grid.style.opacity = '0';
    }, 350);
  }
  player.addEventListener('mousemove', wakeControls);
  player.addEventListener('mouseover', wakeControls);
  player.addEventListener('click', wakeControls);
  player.addEventListener('keydown', wakeControls);
  player.addEventListener('mouseleave', () => {
    hoverFixture.playerLeaves += 1;
    player.classList.add('ytp-autohide');
    bar.style.opacity = '0';
    title.style.opacity = '0';
    metadata.style.opacity = '0';
    quickActions.style.opacity = '0';
    grid.style.opacity = '0';
  });
  quickActions.addEventListener('click', () => { hoverFixture.actions += 1; });
  let jumpPromptTimer;
  timeline.addEventListener('mouseenter', () => { player.dataset.nativeHover = 'true'; });
  timeline.addEventListener('mousemove', () => {
    hoverFixture.hovers += 1;
    player.dataset.nativeHover = 'true';
    const segment = hoverFixture.segments?.find(({ start, end }) => video.currentTime >= start && video.currentTime < end);
    if (segment || (hoverFixture.offerJump && !hoverFixture.segments)) {
      clearTimeout(jumpPromptTimer);
      jumpPromptTimer = setTimeout(() => offerJump(segment), hoverFixture.jumpDelay);
    }
  });
  function offerJump(segment) {
    if (!player.querySelector('.ytp-timely-actions-overlay')) {
      const overlay = document.createElement('div');
      overlay.className = 'ytp-timely-actions-overlay';
      overlay.innerHTML = '<button>Jump ahead<div class="ytSpecTouchFeedbackShapeFill"></div></button>';
      overlay.querySelector('button').addEventListener('click', () => {
        hoverFixture.jumps += 1;
        video.currentTime = segment?.end ?? video.currentTime + 1;
        overlay.remove();
      });
      player.appendChild(overlay);
    }
  }
  timeline.addEventListener('mouseleave', () => {
    clearTimeout(jumpPromptTimer);
    hoverFixture.leaves += 1;
    player.dataset.nativeHover = 'false';
  });
  video.addEventListener('seeking', () => { hoverFixture.seeks += 1; });
</script>
</body></html>
